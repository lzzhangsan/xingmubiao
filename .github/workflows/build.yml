name: Progress Record

on:
  push:
    branches: [ main, master, feature/family-development-system ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master, feature/family-development-system ]

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Record progress node
      run: |
        echo "Progress node recorded successfully"
        echo "Commit: ${{ github.sha }}"
        echo "Message: ${{ github.event.head_commit.message }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "This workflow only records the node and does not build the app."
